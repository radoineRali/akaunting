name: CI/CD Akaunting DevSecOps

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: Deploy_Akaunting

    steps:
    # 1️⃣ Checkout code
    - name: Checkout code
      uses: actions/checkout@v4

    # 2️⃣ Set up Docker Buildx
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 3️⃣ Build Docker image
    - name: Build Docker image
      run: |
        docker build -t akaunting-app:latest .

    # 4️⃣ Verify image exists
    - name: List Docker images
      run: docker images

    # 5️⃣ Save Docker image to tar
    - name: Save Docker image
      run: docker save akaunting-app:latest -o akaunting-app.tar

    # 6️⃣ Copy tar to EC2
    - name: Copy Docker image to EC2
      uses: appleboy/scp-action@master
      with:
        host: ${{ vars.EC2_HOST }}
        username: ${{ vars.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "akaunting-app.tar"
        target: "/home/${{ vars.EC2_USER }}/akaunting-app.tar"

    # 7️⃣ Deploy on EC2
    - name: Deploy on EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ vars.EC2_HOST }}
        username: ${{ vars.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          echo "Load Docker image"
          docker load -i /home/${{ vars.EC2_USER }}/akaunting-app.tar

          echo "Go to project directory"
          mkdir -p /home/${{ vars.EC2_USER }}/akaunting
          cd /home/${{ vars.EC2_USER }}/akaunting || exit

          echo "Stop current containers"
          docker compose down || true

          echo "Start new containers"
          docker compose up -d

          echo "Deployment finished ✅"
