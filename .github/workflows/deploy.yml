name: CI/CD Akaunting DevSecOps

on:
  push:
    branches:
      - master

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: Deploy_Akaunting
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # البناء على GitHub لتجنب نفاذ ذاكرة EC2
      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/akaunting-app:latest

  deploy-on-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: Deploy_Akaunting
    steps:
      - name: Deploy on EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.EC2_HOST }}
          username: ${{ vars.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # إنشاء مجلد العمل
            mkdir -p /home/${{ vars.EC2_USER }}/akaunting
            cd /home/${{ vars.EC2_USER }}/akaunting

            echo "Pulling latest image..."
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/akaunting-app:latest

            echo "Creating docker-compose.yml..."
            # إنشاء ملف الكومبوز في السيرفر بناءً على ملفك الذي أرسلته
            cat <<EOF > docker-compose.yml
            version: '3.8'
            services:
              akaunting-app:
                image: ${{ secrets.DOCKERHUB_USERNAME }}/akaunting-app:latest
                container_name: akaunting_app
                ports:
                  - "80:80"
                environment:
                  - APP_ENV=local
                  - APP_DEBUG=true
                  - APP_URL=http://${{ vars.EC2_HOST }}
                  - DB_CONNECTION=mysql
                  - DB_HOST=akaunting-db
                  - DB_PORT=3306
                  - DB_DATABASE=akaunting
                  - DB_USERNAME=akaunting
                  - DB_PASSWORD=akaunting_pass
                depends_on:
                  - akaunting-db
                restart: always

              akaunting-db:
                image: mariadb:10.7
                container_name: akaunting_db
                environment:
                  - MYSQL_DATABASE=akaunting
                  - MYSQL_USER=akaunting
                  - MYSQL_PASSWORD=akaunting_pass
                  - MYSQL_ROOT_PASSWORD=root_pass
                volumes:
                  - akaunting_db_data:/var/lib/mysql
                restart: always

            volumes:
              akaunting_db_data:
            EOF

            echo "Restarting Services..."
            sudo docker compose down || true
            sudo docker compose up -d

            echo "Cleaning up..."
            sudo docker image prune -f
            
            echo "Deployment finished ✅"