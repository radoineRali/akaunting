name: CI/CD Akaunting DevSecOps

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: deploy_akaunting

    steps:
    # 1️⃣ Checkout الكود
    - name: Checkout code
      uses: actions/checkout@v4

    # 2️⃣ إعداد Docker Buildx
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 3️⃣ تسجيل الدخول لـ Docker Hub
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ vars.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # 4️⃣ Build و Push Docker image (استخدام الكاش لجعل البناء أسرع)
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ vars.DOCKERHUB_USERNAME }}/akaunting:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # 5️⃣ Deploy على EC2
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ vars.EC2_HOST }}
        username: ${{ vars.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        command_timeout: 20m  # زيادة وقت المهلة لتجنب الـ Timeout
        script: |
          # التأكد من وجود المجلد
          mkdir -p ~/akaunting
          cd ~/akaunting || exit

          echo "Pull latest image..."
          docker pull ${{ vars.DOCKERHUB_USERNAME }}/akaunting:latest

          echo "Updating docker-compose.yml..."
          # ملاحظة: إذا كنت تريد تحديث ملف الكومبوز تلقائياً، يفضل استخدامه مع سكريبت النقل
          # لكن حالياً سنفترض أنه موجود أو سنقوم بتشغيل الحاوية مباشرة
          
          echo "Restarting containers..."
          # استخدام -f لضمان المسار الصحيح وإعادة التشغيل بالصورة الجديدة
          docker compose down --remove-orphans || true
          docker compose up -d

          echo "Cleanup: Removing dangling images to save space..."
          docker image prune -f

          echo "Deployment finished ✅"