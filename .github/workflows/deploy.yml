name: CI/CD Akaunting DevSecOps

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: Deploy_Akaunting
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ vars.DOCKERHUB_USERNAME }}   
        password: ${{ secrets.DOCKERHUB_TOKEN }}   

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ vars.DOCKERHUB_USERNAME }}/akaunting:latest

    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ vars.EC2_HOST }}            
        username: ${{ vars.EC2_USER }}        
        key: ${{ secrets.EC2_SSH_KEY }}       
        script: |
          echo "Pull latest image"
          docker pull ${{ vars.DOCKERHUB_USERNAME }}/akaunting:latest

          echo "Go to project directory"
          cd akaunting || exit

          echo "Stop current containers"
          docker compose down

          echo "Start new containers"
          docker compose up -d

          echo "Deployment finished ✅"