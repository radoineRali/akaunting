name: CI/CD Akaunting DevSecOps

on:
  push:
    branches:
      - master

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: Deploy_Akaunting
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/akaunting-app:latest

  deploy-on-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: Deploy_Akaunting
    steps:
      - name: Deploy on EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.EC2_HOST }}
          username: ${{ vars.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 20m
          script: |
            mkdir -p /home/${{ vars.EC2_USER }}/akaunting
            cd /home/${{ vars.EC2_USER }}/akaunting

            cat <<EOF > docker-compose.yml
            version: '3.8'
            services:
              db:
                image: mariadb:10.7
                restart: always
                environment:
                  MYSQL_DATABASE: akaunting
                  MYSQL_USER: akaunting
                  MYSQL_PASSWORD: akaunting_password
                  MYSQL_ROOT_PASSWORD: root_password
                volumes:
                  - db_data:/var/lib/mysql

              app:
                image: ${{ secrets.DOCKERHUB_USERNAME }}/akaunting-app:latest
                restart: always
                ports:
                  - "80:80"
                depends_on:
                  - db
                environment:
                  DB_HOST: db
                  DB_DATABASE: akaunting
                  DB_USERNAME: akaunting
                  DB_PASSWORD: akaunting_password

            volumes:
              db_data:
            EOF

            echo "${{ secrets.DOCKERHUB_TOKEN }}" | sudo docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/akaunting-app:latest
            
            sudo docker compose down || true
            sudo docker compose up -d

            sudo docker image prune -f

            echo "Deployment finished successfully!"