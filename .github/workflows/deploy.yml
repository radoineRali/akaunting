name: CI/CD Akaunting DevSecOps

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # تأكد أن اسم الـ environment مطابق تماماً لما هو في إعدادات GitHub
    environment: Deploy_Akaunting 

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # بناء الصورة وضغطها لتقليل وقت النقل
    - name: Build and Save Docker image
      run: |
        docker build -t akaunting-app:latest .
        docker save akaunting-app:latest | gzip > akaunting-app.tar.gz

    # نسخ ملف الـ Image المضغوط + ملف docker-compose إلى السيرفر
    - name: Copy Files to EC2
      uses: appleboy/scp-action@master
      with:
        host: ${{ vars.EC2_HOST }}
        username: ${{ vars.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        # سنقوم بنقل الـ Image وملف الـ Compose لضمان عمل السيرفر
        source: "akaunting-app.tar.gz,docker-compose.yml"
        target: "/home/${{ vars.EC2_USER }}/akaunting"

    - name: Deploy on EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ vars.EC2_HOST }}
        username: ${{ vars.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        # زيادة الوقت لأن عملية load تأخذ وقتاً
        command_timeout: 20m 
        script: |
          cd /home/${{ vars.EC2_USER }}/akaunting
          
          echo "Unzipping and Loading Docker image..."
          gunzip -c akaunting-app.tar.gz | docker load

          echo "Cleaning up old containers..."
          docker compose down --remove-orphans || true

          echo "Start new containers..."
          docker compose up -d

          echo "Removing tar file to save space..."
          rm akaunting-app.tar.gz
          
          echo "Deployment finished ✅"